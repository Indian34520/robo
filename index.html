<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robo-Fernsteuerung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root { --bg: #f4f5f1; --plate: #ffffff; --ink: #1c2420; --muted: #5b655f; --line: #dde2dc; --green: #00a05a; --yellow: #ffcd03; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #12171a; --plate: #1b2226; --ink: #ecf0ee; --muted: #a2aea8; --line: #2c363b; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font: 600 2rem/1.15 "Fredoka", system-ui, sans-serif; margin: 0; }
p { margin: 0; color: var(--muted); }
a.card { display: grid; gap: 4px; padding: 20px; border-radius: 18px; background: var(--plate); border: 2px solid var(--line); color: var(--ink); text-decoration: none; border-left: 10px solid var(--c); }
a.card:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
a.card b { font: 600 1.35rem "Fredoka", system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <h1>Robo-Fernsteuerung</h1>
  <p>Mit dem Xbox-Controller fahren. Auf dem iPad in der App Bluefy öffnen.</p>
  <a class="card" href="microbit.html" style="--c: var(--green)"><b>micro:bit-Auto</b><span>micro:bit mit SG-EMIB-01A-Platine</span></a>
  <a class="card" href="lego.html" style="--c: var(--yellow)"><b>LEGO SPIKE Prime</b><span>LEGO-Hub (Fahren nur mit Pybricks)</span></a>
</main>
</body>
</html>
